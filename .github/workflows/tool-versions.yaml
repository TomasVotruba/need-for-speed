name: Tool Versions

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # daily, so a new release of either tool turns the badge red
    - cron: '0 6 * * *'

jobs:
  check-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if pinned versions fall behind the latest 3 releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # the 3 most recent releases, newest first - a little tolerance so a fresh
          # patch does not immediately turn the badge red
          recent() {
            gh api "repos/$1/releases?per_page=10" --jq '.[].tag_name' | sed 's/^v//' | head -3
          }
          pinned() {
            grep -oP "^$1=\"\\\$\{$1:-\K[0-9]+\.[0-9]+\.[0-9]+" setup.sh
          }

          fail=0
          check() {
            local name="$1" repo="$2" var="$3" have window
            have="$(pinned "$var")"
            window="$(recent "$repo")"
            if printf '%s\n' "$window" | grep -qxF "$have"; then
              echo "OK   $name: pinned $have within latest 3 ($(printf '%s' "$window" | paste -sd, -))"
            else
              echo "FAIL $name: pinned $have behind latest 3 ($(printf '%s' "$window" | paste -sd, -))"
              fail=1
            fi
          }

          check PHPStan phpstan/phpstan PHPSTAN_VERSION
          check Mago carthage-software/mago MAGO_VERSION
          check mir jorgsowa/mir MIR_VERSION
          check ECS ecsphp/ecs ECS_VERSION

          exit $fail

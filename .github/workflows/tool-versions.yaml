name: Tool Versions

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # daily, so a new release of either tool turns the badge red
    - cron: '0 6 * * *'

jobs:
  check-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fail if pinned versions are not the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest() {
            gh api "repos/$1/releases/latest" --jq '.tag_name' | sed 's/^v//'
          }
          pinned() {
            grep -oP "^$1=\"\\\$\{$1:-\K[0-9]+\.[0-9]+\.[0-9]+" setup.sh
          }

          fail=0
          check() {
            local name="$1" repo="$2" var="$3" have want
            have="$(pinned "$var")"
            want="$(latest "$repo")"
            if [ "$have" = "$want" ]; then
              echo "OK   $name: pinned $have == latest $want"
            else
              echo "FAIL $name: pinned $have != latest $want"
              fail=1
            fi
          }

          check PHPStan phpstan/phpstan PHPSTAN_VERSION
          check Mago carthage-software/mago MAGO_VERSION
          check ECS ecsphp/ecs ECS_VERSION

          exit $fail

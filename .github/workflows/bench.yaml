name: Benchmark

on:
  workflow_dispatch:
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: phpstan
            setup_tools: phpstan
          - group: mago
            setup_tools: mago
          - group: ecs
            setup_tools: ecs
          - group: php-cs-fixer
            setup_tools: php-cs-fixer
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 7.4 (for the Laravel 8.x project)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install GNU time
        run: sudo apt-get update && sudo apt-get install -y time

      - name: Install tools and projects
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_TOOLS: ${{ matrix.setup_tools }}
        run: ./setup.sh

      - name: Run benchmark (${{ matrix.group }})
        env:
          BENCH_GROUP: ${{ matrix.group }}
          ROWS_ONLY: '1'
        run: ./bench.sh

      - name: Upload row fragment
        uses: actions/upload-artifact@v4
        with:
          name: rows-${{ matrix.group }}
          path: results/rows-${{ matrix.group }}.md

  merge:
    needs: bench
    runs-on: ubuntu-latest
    steps:
      - name: Download row fragments
        uses: actions/download-artifact@v4
        with:
          path: merged
          pattern: rows-*
          merge-multiple: true

      - name: Assemble results.md
        run: |
          mkdir -p results
          {
            echo "# Results"
            echo
            echo "- Env: GitHub Actions \`ubuntu-latest\`, PHP 8.4"
            echo "- PHPStan level 8; Mago \`analyze\` with strict toggles; ECS and PHP-CS-Fixer at PER-CS."
            echo "- All pinned to 24 threads/processes. Median of 3 runs. Time in seconds."
            echo
            echo "| Project | Files (src) | Tool | Version | Cold (s) | Hot (s) |"
            echo "|---------|------------:|------|---------|---------:|--------:|"
            cat merged/rows-*.md | sort -n | cut -f2-
          } > results/results.md

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/results.md

      - name: Print results
        run: cat results/results.md >> "$GITHUB_STEP_SUMMARY"

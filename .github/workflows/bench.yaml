name: Benchmark

on:
  workflow_dispatch:
  pull_request:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      - name: Install GNU time
        run: sudo apt-get update && sudo apt-get install -y time

      - name: Install tools and projects
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./setup.sh

      - name: Run benchmark
        run: ./bench.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/results.md

      - name: Print results
        if: always()
        run: cat results/results.md >> "$GITHUB_STEP_SUMMARY"
